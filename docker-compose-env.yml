services:
  machine_learning:
    container_name: bd-ml
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        root_path: /
        api_port: 8000
    command: uvicorn api.app:app --host 0.0.0.0 --reload --reload-include api/*
    env_file:
      - .env
    volumes:
      - ./api:/project/api
    ports:
      - 5003:8000
    networks:
      - botdetector-network

networks:
  botdetector-network:
